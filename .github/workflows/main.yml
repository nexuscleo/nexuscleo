name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # O GITHUB_TOKEN embutido é suficiente para fazer checkout do próprio repo
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          # MY_STATS_TOKEN é necessário aqui pois o GITHUB_TOKEN não pode fazer push para branches de output em alguns casos
          GITHUB_TOKEN: ${{ secrets.MY_STATS_TOKEN }}

      - name: Instalar Requests (necessário para o script de stats)
        run: pip install requests

      - name: Gerar Minha Nova Stats Customizada
        env:
          GITHUB_TOKEN: ${{ secrets.MY_STATS_TOKEN }}
        run: python github_stats_custom.py

      - name: Commit e Push de todas as mudanças
        env:
          MY_STATS_TOKEN: ${{ secrets.MY_STATS_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${MY_STATS_TOKEN}@github.com/${{ github.repository }}
          git add .
          git commit -m "Update profile badges" || exit 0
          git push
